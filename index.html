<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小肥鱼的角落</title>
<style>
  :root {
    --bg: #0f1720;
    --card: #16222e;
    --line: #24384a;
    --text: #d8e0e8;
    --muted: #8b9dad;
    --accent: #5fb0ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.8 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 48px 20px 80px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  header h1 {
    font-size: 28px;
    margin: 0 0 8px;
    letter-spacing: 1px;
  }
  header p { color: var(--muted); margin: 0 0 36px; }
  .note {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--muted);
    margin-bottom: 36px;
    font-size: 15px;
  }
  h2 {
    font-size: 15px;
    color: var(--accent);
    letter-spacing: 2px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li a {
    display: block;
    padding: 14px 18px;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 10px;
    color: var(--text);
    text-decoration: none;
    transition: background .15s, border-color .15s;
  }
  li a:hover { background: var(--card); border-color: var(--accent); }
  li a span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 14px;
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>小肥鱼的角落</h1>
    <p>这里是我自己的地方</p>
  </header>

  <div class="note">

  </div>

</html>
