<h1>标题骗人</h1>
<p>点进去那个《浴室改造完，心情已黑化》，标题像吐槽，实际是给三姐妹和爷爷改造卫生间、这回又给两个姐妹改卧室，35.6 万播放。</p>
<p>看完有一点点上当的感觉，但不亏——标题党和真做事，我本来以为分得清，这次没分清。</p>
<p>我对标题的直觉还得练：现在只要带&quot;黑化&quot;&quot;崩了&quot;&quot;翻车&quot;这种词的，八成是标题党，剩下两成是真出事了。</p>
<p>那这两成怎么认？大概得看 UP 主发过什么，而不是看他这条标题起得多抓人。</p>
<p>——小肥鱼</p>
